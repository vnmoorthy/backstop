[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backstop"
version = "0.1.0"
description = "Backstop — hexagonal voice-agent swarm that recovers denied insurance claims by winning the phone appeal."
readme = "README.md"
requires-python = "==3.9.*"
license = { text = "Proprietary" }
keywords = [
    "healthcare", "claims", "appeals", "voice-agent", "hexagonal",
    "ports-and-adapters", "fastapi", "phi-redaction",
]
authors = [
    { name = "NarasingaMoorthy VeiluKanthaPerumal", email = "vnarasingamoorthy@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Framework :: FastAPI",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "httpx>=0.27,<1.0",
    "aiosqlite>=0.20,<1.0",
    "anyio>=4.3,<5.0",
    "numpy>=1.26,<3.0",
    "cryptography>=42.0",
    "PyJWT>=2.8,<3.0",
    "reportlab>=4.1,<5.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Real-mode vendor SDKs (torch optional: the numpy PAVO path stays torch-free).
real = [
    "torch>=2.1,<3.0",
    "boto3>=1.34",
    "aioboto3>=12.3",
    "livekit-api>=0.6",
    "tiktoken>=0.6",
]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "pytest-httpx==0.30.0",
    "pytest-randomly==3.15.0",
    "hypothesis==6.103.1",
    "freezegun==1.5.1",
    "anyio==4.4.0",
    "schemathesis==3.31.0",
    "ruff==0.4.10",
    "mypy==1.10.0",
    "bandit==1.7.9",
    "pip-audit==2.7.3",
    "diff-cover==9.0.0",
]

[project.urls]
Homepage = "https://github.com/vnmoorthy/backstop"
Issues = "https://github.com/vnmoorthy/backstop/issues"

[project.scripts]
backstop = "backstop.app:app"

# ── Packaging: the package root is `backstop`, living at orchestrator/backstop ──
[tool.setuptools.packages.find]
where = ["."]
include = ["backstop*"]

[tool.setuptools.package-data]
backstop = ["py.typed"]

# ──────────────────────────────── Ruff ───────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py39"
src = ["."]
# The legacy v1 prototype coexists with the v2 hexagon during the rebuild and is
# removed atomically in the integration milestone (M17). Exclude it so lint
# governs only the new architecture.
extend-exclude = [
    "backstop/server.py",
    "backstop/swarm.py",
    "backstop/call.py",
    "backstop/cost.py",
    "backstop/reconcile.py",
    "backstop/letter.py",
    "backstop/ivr_sim.py",
    "backstop/models.py",
    "backstop/integrations",
    "backstop/pavo",
    "tests/test_call.py",
    "tests/test_e2e.py",
    "tests/test_router.py",
    "tests/load_test.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "D",    # pydocstyle (module/class docstrings)
    "ASYNC",# flake8-async
    "S",    # flake8-bandit
]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
    "UP007", # keep Optional[X]/Union for py3.9 runtime (no `X | Y`)
    "UP006", # keep typing.List/Dict at runtime for py3.9
    "UP035", # keep typing imports (List/Dict) for py3.9
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106"]  # docstrings + asserts/secrets in tests
"backstop/agents/roster.py" = ["E501"]  # one-line-per-agent data table reads better wide
# Deliberate HTTP-semantic domain exception names (Unauthenticated/Forbidden/
# ChannelNotFound) — clearer than an -Error suffix at the call site.
"backstop/domain/errors.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ──────────────────────────────── Mypy ───────────────────────────────────
[tool.mypy]
python_version = "3.9"
strict = true
mypy_path = "."
files = ["backstop"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Vendor SDKs without bundled type stubs (real-mode only).
module = [
    "torch.*",
    "boto3.*",
    "aioboto3.*",
    "botocore.*",
    "livekit.*",
    "reportlab.*",
    "aiosqlite.*",
    "pavo_bench.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ─────────────────────────────── Pytest ──────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:randomly --strict-markers --strict-config -ra"
markers = [
    "contract: per-port real/sim substitutability suites",
    "security: named audit-finding regression tests",
    "load: nightly load/resilience tests (non-blocking on PRs)",
    "e2e: end-to-end black-box journeys",
]
filterwarnings = ["error"]

# ──────────────────────────────── Coverage ────────────────────────────────
[tool.coverage.run]
source = ["backstop"]
branch = true
omit = [
    "backstop/web/*",
    "backstop/adapters/pavo/weights/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

# ──────────────────────────────── Bandit ──────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", "backstop/web"]
